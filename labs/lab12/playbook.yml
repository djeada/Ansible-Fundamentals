---
- name: Verify desired state with independent assertions
  hosts: sandbox
  gather_facts: false
  vars:
    course_expected_version: v1
  pre_tasks:
    - name: Prepare training workspace
      ansible.builtin.import_tasks: ../../playbooks/guard.yml
      tags: [always]
  tasks:
    - name: Create lab directory
      ansible.builtin.file:
        path: "{{ training_root }}/lab12"
        state: directory
        mode: '0755'
      tags: [configure]

    - name: Deploy the release manifest
      ansible.builtin.copy:
        content: "{{ {'version': 'v1', 'healthy': true} | to_nice_json }}\n"
        dest: "{{ training_root }}/lab12/release.json"
        mode: '0644'
      tags: [configure]

    - name: Read the deployed file
      ansible.builtin.slurp:
        src: "{{ training_root }}/lab12/release.json"
      register: course_deployed
      when: not ansible_check_mode
      tags: [verify]

    - name: Assert the observable deployment contract
      ansible.builtin.assert:
        that:
          - (course_deployed.content | b64decode | from_json).version == course_expected_version
          - (course_deployed.content | b64decode | from_json).healthy
      when: not ansible_check_mode
      tags: [verify]
