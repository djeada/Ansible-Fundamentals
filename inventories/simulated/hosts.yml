---
all:
  children:
    sandbox:
      hosts:
        node_a:
        node_b:
    controller:
      hosts:
        localhost:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    training_root: "{{ (inventory_dir ~ '/../../.sandbox') | realpath }}"
    ansible_remote_tmp: "{{ training_root }}/.ansible/remote"
    course_environment: development
    course_message: Hello from Ansible
